# orbital charges only, equivariant charge head (Fig. 1b)
_target_: orbq.model.module.MultitaskLightningModule
name: charges_orbital_dxtb

criterion: mae
charges_type: orbital_dxtb  # none | orbital_dxtb | atomic_dxtb | atomic_lowdin | atomic_mulliken
loss_coeffs:
  energy: 0.0
  charges: 1.0
  forces: 0.0

pbc: false
dft_basis_set: gfn1  # GFN1-xTB basis defines the orbital layout of the charge head
orb_cutoff: 5.0

defaults:
  - backbone@model: escn_charges
