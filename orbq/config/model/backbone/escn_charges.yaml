# eSCN backbone with equivariant charge head (no force head)
_target_: orbq.model.scn.eSCN
num_layers: 4
lmax_list: [2]
mmax_list: [2]
cutoff: 5.0
sphere_channels: 128
hidden_channels: 256
edge_channels: 128
num_sphere_samples: 128
regress_forces: false
regress_charges: true
use_equivariant_predictor: true
